[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoyo_story"]

[project]
name = "hoyo-story-extractor"
version = "0.3.0"
description = "多游戏米哈游剧情文本自动提取引擎"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "3aKHP", email = "cccp1945@vip.qq.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Text Processing",
]
keywords = ["genshin", "honkai", "zzz", "hoyoverse", "story", "text-extraction", "nlp"]
dependencies = [
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/3aKHP/hoyo-story-extractor"
Repository = "https://github.com/3aKHP/hoyo-story-extractor"
Issues = "https://github.com/3aKHP/hoyo-story-extractor/issues"

[project.scripts]
hoyo-extract = "hoyo_story.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

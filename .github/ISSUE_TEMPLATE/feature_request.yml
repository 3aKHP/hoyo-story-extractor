name: Feature request
description: Suggest an extractor, converter, or infrastructure improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or data type should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior and any constraints.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation idea
      description: How could this be tested without committing raw game data?
    validations:
      required: false
